name: Core Regression Tests

# Item 24: the previous workflow ran only 12 hand-picked test files and
# triggered only on main / fix/core-correctness-audit — branches like `reveo`
# had NO coverage and tests (data_ml, tamper-hash, downgrade, risk,
# test_db_models) never ran in CI. Now: the FULL supported suite runs.
#
# Buglist item 8: `automation/news-pause` (the active development branch) was
# missing from the push trigger — its pushes were never auto-tested.
#
# Buglist item 9: there was NO Windows runner — the MetaTrader5-dependent and
# timestamp-offset tests only ever skipped themselves on ubuntu, so ~15% of
# the suite (incl. the MT5-sensitive ones) never executed in CI. A windows
# job now runs the same suite (terminal-dependent tests skip themselves).
#
# Buglist item 10: CI installed `pip install -e ".[dev]"` — fresh resolutions
# that are NOT the versions the verified suite ran against. Both jobs now
# install the pinned requirements-lock.txt closure plus the package itself
# with --no-deps, so green CI tests the locked environment.
on:
  pull_request:
  push:
    branches: [main, fix/core-correctness-audit, reveo, automation/news-pause]
  workflow_dispatch:

jobs:
  core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The lock file (requirements-lock.txt) was generated and verified
          # against Python 3.14 — CI must match it, not float on another
          # minor version.
          python-version: "3.14"
          cache: pip
      - name: Install locked dependency closure and the package
        # Buglist item 11: the MetaTrader5 pin carries a Windows-only marker
        # inside requirements-lock.txt, so this Linux install skips it (the
        # provider import sets MT5_AVAILABLE=False on non-Windows).
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Compile and import application modules
        run: |
          python -m compileall -q backend migrations
          python -c "import backend.app.main; from backend.app.api.v1.endpoints import backtest, documents, ml, signals"
          # Destination safety: Alembic refuses to run without an explicitly
          # pinned ALEMBIC_DATABASE_URL, so the smoke migration pins the tmp DB.
          ALEMBIC_DATABASE_URL=sqlite:///./migration-smoke.db python -m alembic upgrade head
      - name: Run full backend test suite (MT5-terminal-dependent tests skip themselves)
        # The MetaTrader5 python package is Windows-only: on ubuntu the
        # provider import sets MT5_AVAILABLE=False and the dependent tests
        # skip themselves (test_mt5_provider, test_audit_fixes_h6 are marked
        # skipif). Everything else — data_ml, tamper/digest, downgrade,
        # risk/circuit_breaker, test_db_models, knowledge, API integration —
        # runs here on isolated in-memory/tmp databases.
        run: python -m pytest backend/tests -q

  windows-regression:
    # Buglist item 9: the MT5-sensitive and timestamp-offset tests (and every
    # Windows-specific path) must actually EXECUTE somewhere in CI. This job
    # runs the same locked environment on Windows; tests that need a RUNNING
    # MT5 terminal still skip themselves when the terminal is absent.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install locked dependency closure and the package
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
        shell: bash
      - name: Compile and import application modules
        run: |
          python -m compileall -q backend migrations
          python -c "import backend.app.main; from backend.app.api.v1.endpoints import backtest, documents, ml, signals"
          python -m alembic upgrade head
        env:
          ALEMBIC_DATABASE_URL: sqlite:///./migration-smoke.db
        shell: bash
      - name: Run full backend test suite (MetaTrader5 package present; terminal-dependent tests skip)
        run: python -m pytest backend/tests -q
        shell: bash
