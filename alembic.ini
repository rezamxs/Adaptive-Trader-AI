# A generic, single database configuration.

[alembic]
# path to migration scripts — %(here)s pins both locations to the directory
# of THIS ini file, so `alembic upgrade head` resolves the script and version
# directories identically from ANY working directory. CWD-relative values
# here made alembic silently find ZERO revision files when run from another
# directory: `upgrade head` then "succeeded" without running a single
# migration (only an empty alembic_version table was created).
script_location = %(here)s/migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file as
# well as the filename.
# If specified, requires the python-dateutil library.
# timezone =

# max length of characters to apply to the
# "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to migrations/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# %(here)s makes this CWD-independent (see script_location above).
version_locations = %(here)s/migrations/versions

# How version_locations entries are split. 'os' = os.pathsep (Windows ';',
# POSIX ':'), 'space' = legacy space/comma splitting. Set explicitly so
# alembic>=1.13 does not warn about the missing setting.
path_separator = os

# the output encoding used when revision files
# are written from script.py.mako
output_encoding = utf-8

# Item 39: this URL is intentionally a PLACEHOLDER. migrations/env.py reads
# ONLY the ALEMBIC_DATABASE_URL env var and fails closed with a RuntimeError
# when it is not set — it never falls back to the app's settings.DATABASE_URL
# (that fallback is how the H4 incident reached production). Do NOT "fix"
# this line to point at a real database: a CWD-relative URL here is exactly
# how a wrong copy of adaptive_trader.db gets created or migrated by accident.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
