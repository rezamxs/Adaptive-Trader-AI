[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-trader-ai"
version = "0.1.0"
description = "Adaptive Algorithmic Trading System with ML, Strategy Analytics, and MetaTrader 5 Integration"
authors = [{ name = "Adaptive Trader AI Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.2",
    "python-dotenv>=1.0.0",
    "defusedxml>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    # Minor 19: measured coverage (`python -m pytest tests --cov=backend/app`).
    "pytest-cov>=5.0.0",
]
# Buglist item 12: the app genuinely imports MetaTrader5 (market-data
# provider, worker, executor) but it was never declared in the packaging
# metadata — only requirements-lock.txt carried it, so a plain `pip install .`
# produced a broken environment. It is an OPTIONAL extra, not a core
# dependency, because the distribution ships Windows wheels only; elsewhere
# the provider import degrades to MT5_AVAILABLE=False and the
# terminal-dependent tests skip themselves.
mt5 = [
    "MetaTrader5>=5.0.6231; sys_platform == 'win32'",
]

# Only the backend is an installable Python package. The other top-level
# directories contain datasets, logs, static frontend files, or artifacts.
[tool.setuptools.packages.find]
where = ["."]
include = ["backend", "backend.*"]
exclude = ["backend.tests", "backend.tests.*"]
namespaces = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["backend/tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    # Item 43: the blanket `ignore::DeprecationWarning` hid ALL deprecations,
    # including first-party regressions. Only the known third-party noise is
    # suppressed: fastapi's TestClient still imports httpx-backed
    # starlette.testclient (upstream migration to httpx2 pending).
    "ignore::DeprecationWarning:fastapi.testclient",
]

# Minor 19: measured coverage (run explicitly, never in the default addopts so
# the plain suite stays fast):
#   python -m pytest backend/tests --cov=backend/app --cov-report=term
[tool.coverage.run]
source = ["backend/app"]
omit = ["backend/tests/*"]
